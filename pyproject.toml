[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obb-loss"
version = "0.1.0"
description = "Typed packed oriented-box losses for DETR-like detectors"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" }]
dependencies = ["torch>=2.2", "einops>=0.7", "jaxtyping>=0.2", "pydantic>=2", "numpy>=1.26"]

[dependency-groups]
dev = ["pyrefly>=1.3.1", "ruff>=0.16.9", "pytest>=8", "pytest-cov>=5"]

[tool.hatch.build.targets.wheel]
packages = ["src/obb_loss"]
