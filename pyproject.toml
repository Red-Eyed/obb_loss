[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obb-loss"
version = "0.12.1"
description = "Numerically stable oriented-box and quality-classification losses"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" }]
dependencies = ["torch>=2.2", "einops>=0.7"]

[dependency-groups]
dev = [
    "pyrefly==1.3.1",
    "ruff>=0.16.9",
    "pytest>=8",
    "pytest-cov>=5",
    "typing-extensions>=4.12",
    "numpy>=2.4.6",
]
shapes = ["pyrefly-torch-stubs==1.3.1; python_version >= '3.12'", "pyrefly-shape-extensions==1.3.1; python_version >= '3.12'"]

[tool.uv]
default-groups = ["dev", "shapes"]

[tool.hatch.build.targets.wheel]
packages = ["src/obb_loss"]
