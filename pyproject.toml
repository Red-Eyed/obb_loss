[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "obb-loss"
version = "0.8.0"
description = "Typed packed oriented-box losses for DETR-like detectors"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" }]
dependencies = ["torch>=2.2", "einops>=0.7", "pydantic>=2", "numpy>=1.26", "typing-extensions>=4.12", "scipy>=1.11"]

[dependency-groups]
dev = ["pyrefly==1.3.1", "ruff>=0.16.9", "pytest>=8", "pytest-cov>=5", "scipy-stubs>=1.16", "pydantic-settings>=2.7"]
shapes = ["pyrefly-torch-stubs==1.3.1; python_version >= '3.12'", "pyrefly-shape-extensions==1.3.1; python_version >= '3.12'"]

[tool.uv]
default-groups = ["dev", "shapes"]

[tool.hatch.build.targets.wheel]
packages = ["src/obb_loss"]
